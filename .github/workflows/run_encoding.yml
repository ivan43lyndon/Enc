name: Video Encoding Pipeline

on:
  workflow_dispatch: # Allows you to start it manually from the Actions tab

jobs:
  encode-and-upload:
    runs-on: ubuntu-latest
    # This gives the job a 6-hour timeout to be safe
    timeout-minutes: 360 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: First Pass (Run 1)
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python encode.py

      - name: Second Pass (Run 2 - Resumes if Run 1 timed out)
        # This step runs even if the first pass reached its internal time limit
        if: always() 
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python encode.py

      - name: Cleanup Workspace
        if: always()
        run: |
          rm -rf Encoding_Cache
