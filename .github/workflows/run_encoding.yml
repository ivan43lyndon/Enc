name: Continuous Encoding Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [continue_encoding]

jobs:
  encode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install playwright beautifulsoup4 cloudscraper
          pip install playwright yt-dlp
          playwright install chromium
          playwright install-deps chromium

      - name: Install Python Dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          
      - name: Run Encoder
        id: encoder_step
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        # We handle error status manually, so we don't strictly need continue-on-error here
        run: |
          set +e  # Critical: Prevent the step from failing immediately
          python encode.py
          EXIT_CODE=$?
          set -e  # Re-enable error checking
          
          # Force the exit code into GITHUB_OUTPUT
          echo "status=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Captured Exit Code: $EXIT_CODE"

      - name: Trigger Loop
        # Check if the captured status is exactly 99
        if: steps.encoder_step.outputs.status == '99'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "continue_encoding"}'
