name: Video Encoding Robot
on:
  workflow_dispatch:      # This creates the "Run" button in the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    # This gives the job 6 hours to finish
    timeout-minutes: 360 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Encoding
        env:
          # This line maps the GitHub Secret to the Python Environment Variable
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python encode.py
