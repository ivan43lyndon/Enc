name: Continuous Encoding Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [continue_encoding]

jobs:
  encode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Run Encoder
        id: encoder_step
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        # We add 'continue-on-error' so the workflow doesn't turn red 
        # when we exit early for a timeout.
        continue-on-error: true
        run: |
          python encode.py
          # The script will now set an environment variable 'RESTART_NEEDED' 
          # which we capture here to pass to the next step.
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Trigger Loop
        # ONLY run if the script exited with code 99 (our timeout code)
        if: steps.encoder_step.outputs.status == '99'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "continue_encoding"}'
