name: Continuous Encoding Loop

on:
  workflow_dispatch: # Allows you to start it manually
  repository_dispatch:
    types: [continue_encoding] # Allows the script to restart itself

jobs:
  encode:
    runs-on: ubuntu-latest
    # Necessary permissions for the loop to trigger
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Upgraded to stop the EOL warnings

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Encoder
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python encode.py

      - name: Trigger Loop
        if: always() # Restart even if the script timed out or had a minor error
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "continue_encoding"}'
