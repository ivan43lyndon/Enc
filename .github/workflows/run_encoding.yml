name: Continuous Encoding Loop

on:
  workflow_dispatch: # Allows manual start
  repository_dispatch:
    types: [continue_encoding] # Allows the script to call itself

jobs:
  encode:
    runs-on: ubuntu-latest
    # Grant permission to trigger new runs
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Encoder
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python encode.py

      - name: Check for remaining work and loop
        if: always() # Runs even if the encoder timed out
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # This triggers the same workflow to start again
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "continue_encoding"}'
