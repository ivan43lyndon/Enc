name: Manual - Generate Video Preview Grids

on:
  workflow_dispatch:
    # This enables a manual trigger button specifically for this script

jobs:
  run-grid-generator:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg & FFprobe)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow

    - name: Execute Grid Contact Sheet Generator
      env:
        # Link your existing repository secrets here
        DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        INPUT_FOLDER_ID: ${{ secrets.INPUT_FOLDER_ID }}
        OUTPUT_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        CONFIG_FILE_ID: ${{ secrets.CONFIG_FILE_ID }}
      run: python generate_grids.py
