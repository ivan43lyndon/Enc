name: Manual - Generate Video Preview Grids

on:
  workflow_dispatch:
    # This enables a manual trigger button specifically for this script

jobs:
  run-grid-generator:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        # Removed the cache line to fix the error 🟢

    - name: Install Dependencies
      run: |
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow

    - name: Execute Grid Contact Sheet Generator
      env:
        DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
      run: python generate_grids.py
